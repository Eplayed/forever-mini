# 最简门禁：把仓库根 AGENTS.md「验证基线」里不依赖界面截图的两道卡口搬上 CI。
# 界面渲染证据（site-check / 截图）需要起服务 + 无头 Chrome，仍按规矩在本地跑，不进这条流水线。
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # build-data.js 要回 git 历史核对「本站更新」的提交号，浅克隆会核对不了
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wow-forever-web/app/package-lock.json

      - name: 数据门禁（校验 + 覆盖率 + 禁词，非 0 即失败）
        working-directory: wow-forever-web
        run: node tools/build-data.js

      # 两个脚本内自测：不启动浏览器、不联网、不动真实资料，纯临时目录/假对象。
      # 挂在这里而不是嵌进 build-data.js：生产数据生成不该依赖测试代码，
      # 也不重复挂进 site-check（那条要起服务 + 无头 Chrome，仍按老规矩本地跑）。
      - name: 图标登记校验器自测（夹具回归）
        working-directory: wow-forever-web
        run: python3 tools/build-icon-map.py --selftest

      - name: 路由冒烟退出码与编排自测（不启动浏览器）
        working-directory: wow-forever-web
        run: python3 tools/route-smoke.py --selftest

      - name: 新站安装依赖
        working-directory: wow-forever-web/app
        run: npm ci

      # npm run build 内部先跑 python3 ../tools/app-assets.py 同步数据副本，ubuntu 自带 python3
      - name: 新站构建
        working-directory: wow-forever-web/app
        run: npm run build

      - name: 新站单测
        working-directory: wow-forever-web/app
        run: npx vitest run
