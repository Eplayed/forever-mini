# 最简门禁：把仓库根 AGENTS.md「验证基线」里不依赖界面截图的两道卡口搬上 CI。
# 界面渲染证据（site-check / 截图）需要起服务 + 无头 Chrome，仍按规矩在本地跑，不进这条流水线。
name: gates

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # build-data.js 要回 git 历史核对「本站更新」的提交号，浅克隆会核对不了
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wow-forever-web/app/package-lock.json

      - name: 数据门禁（校验 + 覆盖率 + 禁词，非 0 即失败）
        working-directory: wow-forever-web
        run: node tools/build-data.js

      # 两个脚本内自测：不启动浏览器、不联网、不动真实资料，纯临时目录/假对象。
      # 挂在这里而不是嵌进 build-data.js：生产数据生成不该依赖测试代码，
      # 也不重复挂进 site-check（那条要起服务 + 无头 Chrome，仍按老规矩本地跑）。
      - name: 图标登记校验器自测（夹具回归）
        working-directory: wow-forever-web
        run: python3 tools/build-icon-map.py --selftest

      - name: 路由冒烟退出码与编排自测（不启动浏览器）
        working-directory: wow-forever-web
        run: python3 tools/route-smoke.py --selftest

      - name: 新站安装依赖
        working-directory: wow-forever-web/app
        run: npm ci

      # npm run build 内部先跑 python3 ../tools/app-assets.py 同步数据副本，ubuntu 自带 python3
      - name: 新站构建
        working-directory: wow-forever-web/app
        run: npm run build

      - name: 新站单测
        working-directory: wow-forever-web/app
        run: npx vitest run

      # 下面三步都是 2026-10-20 这一天从真实漏检里长出来的，全部不启动浏览器：
      # ① 物品详情合并的"教学句不许顶掉使用条件"（A02 抓到 247 件），
      # ② public 里的孤儿副本（增量同步只加不删，撤下来的素材会继续被服务，Q05 抓到 54 份原料），
      # ③ 上线包禁含清单（第三方原料、日志、插件原包混进产物就是把自己加工过程发出去）。
      - name: 物品详情合并规则自测（夹具回归）
        working-directory: wow-forever-web
        run: python3 tools/merge-items-detail.py --selftest

      - name: 产物副本与 src 一致（不许有孤儿素材）
        working-directory: wow-forever-web
        run: python3 tools/app-assets.py --check

      - name: 上线包卡口（禁含清单 + 扩展名白名单 + 引用完整性，只验不写包）
        working-directory: wow-forever-web
        run: python3 tools/release-package.py --skip-build --check-only

      # 任务台（本机自动任务管理页）的判据自测：六档状态、执行白名单反例、
      # cron/plist/JSON 改写纯函数，以及"登记表里的关键词不许抄进代码"这条反自证检查。
      # 全部不启动浏览器、不碰 launchctl 与 crontab（只跑纯函数与临时文件）。
      - name: 任务台判据与改写自测
        working-directory: wow-forever-web
        run: python3 tools/taskboard/selftest.py

      # 数据管理台（本机 8830）的自测：物品待审快照的差分与"不碰成品"、动作白名单、
      # 以及刷新前的工作树闸（脏→回清单让人确认；确认后才带 force 跑）。
      # 全部是 mock 与临时目录，不发网络请求、不跑 refresh.sh。
      - name: 数据管理台自测
        working-directory: wow-forever-web
        run: python3 -m unittest discover -s tools/admin
